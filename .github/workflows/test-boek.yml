name: test-boek
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://static.reto.media/ordervantolversuniecom/bestelboeken/
          mkdir b; for n in bestelboek-wk-46.pdf bestelboek-wk-47.pdf 20261006-bestelboek.pdf 20261102-bestelboek.pdf; do curl -s -o b/$n $B$n; done; ls -la b
      - uses: actions/upload-artifact@v4
        with: {name: boeken, path: b}
