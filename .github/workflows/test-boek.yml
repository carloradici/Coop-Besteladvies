name: test-boek
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          curl -s -o k.pdf https://static.reto.media/ordervantolversuniecom/bestelboeken/20261006-bestelboek.pdf
          pdftotext -layout k.pdf - | grep -oE '\b[0-9]{5,9}\b' | sort -u | tr '\n' ' ' | sed 's/^/NRS /'
