# Edge Functions automatisch live zetten in Supabase zodra hun code verandert (geen Deploy-knop meer). Handmatig: Actions › functies-live › Run workflow.
# Nodig: geheim SUPABASE_ACCESS_TOKEN in GitHub en VERKOOP_SLEUTEL in Supabase (Edge Functions › Secrets).
name: functies-live
on:
  push:
    branches: [main]
    paths: [stuur-push.js, dagexport.js, folder.js, verkoop-export.js, 'supabase/functions/**', .github/workflows/functies.yml]
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      P: qgrexmttlceegavnkmkx
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - name: Controleren
        run: '[ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "Geheim SUPABASE_ACCESS_TOKEN ontbreekt in GitHub"; exit 1; }'
      - name: Gedeelde code klaarzetten
        run: mkdir -p supabase/functions/_shared && cp stuur-push.js dagexport.js folder.js verkoop-export.js supabase/functions/_shared/
      - name: Live zetten
        run: |
          F=0
          d(){ n=$1; shift; if o=$(supabase functions deploy $n --project-ref $P --yes "$@" 2>&1); then echo "::notice title=$n::live"; else echo "$o"; echo "::error title=$n::$(echo "$o" | tail -6 | tr '\n' ' ')"; F=1; fi; }
          d stuur-push --no-verify-jwt
          d dagexport --no-verify-jwt
          d folder
          if supabase secrets list --project-ref $P 2>&1 | grep -q VERKOOP_SLEUTEL; then d verkoop-export --no-verify-jwt; else echo "::warning title=verkoop-export::overgeslagen, geheim VERKOOP_SLEUTEL ontbreekt in Supabase"; fi
          exit $F
