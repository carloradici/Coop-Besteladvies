<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.json">

<style>:root{--o:#f17d04;--o2:#d96c00;--ol:#fff3e6;--bg:#f4f4f2;--card:#fff;--t:#1d1d1b;--t2:#6b6b66;--ln:#e2e2dd;--red:#d02a1e;--grn:#1f8a3b;--blue:#1f5fbf;--yel:#fff6c9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:var(--o);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px}
header.top h1{font-size:18px;margin:0;flex:1;font-weight:700;letter-spacing:.2px}
.sync{font-size:12px;background:rgba(255,255,255,.2);border-radius:20px;padding:3px 10px;white-space:nowrap}
.sync.off{background:#7a3a00}
.iconbtn{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;width:38px;height:38px;font-size:20px;line-height:1}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:15px;font-weight:600;color:var(--t2);border-top:3px solid transparent}
nav.tabs button.on{color:var(--o2);border-top-color:var(--o)}
main{padding:0 0 90px}
.bar{background:var(--bg);padding:10px 12px 6px;border-bottom:1px solid var(--ln)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--ln);background:#fff;border-radius:12px;padding:6px 12px;text-align:left;min-width:118px}
.chip b{display:block;font-size:15px}
.chip span{font-size:12px;color:var(--t2)}
.chip.on{border-color:var(--o);background:var(--ol)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input[type=search]{flex:1 1 160px;min-width:0}
input[type=search],input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],select{border:1px solid #cfcfca;border-radius:10px;padding:9px 10px;background:#fff;min-height:42px;font-size:16px}
.row>select{flex:1 1 140px;min-width:0}
.tog{border:1px solid #cfcfca;background:#fff;border-radius:10px;padding:8px 11px;min-height:42px;font-size:14px}
.tog.on{background:var(--o);border-color:var(--o);color:#fff}
.btn{border:0;background:var(--o);color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;min-height:46px}
.btn.sec{background:#fff;color:var(--t);border:1px solid #cfcfca}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px;border-radius:9px}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.5}
.banner{margin:10px 12px 0;background:#fff;border-radius:12px;padding:10px 12px;border-left:5px solid var(--o)}
.banner.warn{border-left-color:var(--red)}
.banner.info{border-left-color:var(--blue)}
.banner h3{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner .sub{font-size:13px;color:var(--t2)}
.banner ul{margin:8px 0 0;padding-left:18px;font-size:14px}
.banner li{margin:3px 0}
.banner li a{color:var(--t);text-decoration:underline}
.grp{position:sticky;top:var(--grpTop,54px);z-index:5;margin:14px 12px 6px;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.4px;color:var(--o2);background:var(--bg);padding:4px 0}
.card{background:var(--card);margin:8px 12px;border-radius:14px;padding:11px 12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card.colli{background:#fffbea}
.card.uit .nm{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:#8a8a85}
.card .hd{display:flex;gap:10px;align-items:flex-start}
.card .nm{font-weight:700;font-size:16px;flex:1}
.card .meta{font-size:13px;color:var(--t2);margin-top:2px}
.adv{flex:none;text-align:center;background:var(--ol);border:2px solid var(--o);border-radius:12px;padding:4px 10px;min-width:64px}
.adv b{display:block;font-size:20px;color:var(--o2);line-height:1.1}
.adv span{font-size:11px;color:var(--t2)}
.adv.nul{border-color:var(--ln);background:#fafaf8}
.adv.nul b{color:var(--t2)}
.lbls{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.lbl{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;background:#eee;color:#333}

.lbl.volgende{background:var(--blue);color:#fff}

.lbl.folder{background:#1d1d1b;color:#fff}
.lbl.instore{background:#fff;border:1px solid #1d1d1b}
.lbl.nieuw{background:var(--grn);color:#fff}

table.wk th{font-weight:600;color:var(--t2);font-size:11px;padding:2px 0}
table.wk td{text-align:center;padding:3px 0;border-top:1px solid #f0f0ec;font-variant-numeric:tabular-nums}
table.wk td.l{color:var(--t2);font-size:11px;text-align:left;width:38px}
table.wk td.a{color:var(--red);font-weight:700}
table.wk td.today{background:var(--ol)}
table.wk tr.gd td{font-weight:800;border-top:2px solid var(--ln)}
table.wk td.gwt{font-weight:800;color:var(--o2)}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ctl label{display:block;font-size:12px;color:var(--t2);margin-bottom:3px;font-weight:600}
.stp{display:flex;align-items:center;border:1px solid #cfcfca;border-radius:12px;overflow:hidden;background:#fff}
.stp button{border:0;background:#f1f1ee;width:46px;height:46px;font-size:22px;font-weight:700}
.stp input{border:0;width:100%;text-align:center;font-size:18px;font-weight:700;min-height:46px;padding:0;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none}
.stp .u{font-size:12px;color:var(--t2);padding-right:8px}
.why{font-size:13px;color:var(--t2);margin-top:8px}
.why b{color:var(--t)}
.hint{font-size:12px;color:var(--t2);margin-top:3px}
.empty{text-align:center;color:var(--t2);padding:40px 20px}
.more{height:40px}
.blk{margin:14px 12px;background:#fff;border-radius:14px;padding:14px}
.blk h2{margin:0 0 10px;font-size:17px}
.blk h3{margin:14px 0 6px;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.list{font-size:14px}
.list .it{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid #f0f0ec}
.list .it:first-child{border-top:0}
.small{font-size:12px;color:var(--t2)}
.log{font-size:13px;background:#fafaf8;border-radius:10px;padding:8px 10px;margin-top:10px;max-height:240px;overflow:auto}
.log div{padding:2px 0}
.log .ok{color:var(--grn)}.log .err{color:var(--red)}
.form{display:grid;gap:10px}
.form .f{display:flex;align-items:center;gap:10px;justify-content:space-between}
.form .f label{font-size:14px}
.form .f input,.form .f select{width:130px}
.melding{margin-top:8px;padding:8px 10px;border-radius:10px;font-weight:700;font-size:14px}
.melding.op{background:#fde7e5;color:var(--red)}
.melding.veel{background:#e6efff;color:var(--blue)}
.login{max-width:380px;margin:12vh auto 0;padding:24px}
.login h1{color:var(--o2);margin:0 0 4px}
.login .form input{width:100%}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#1d1d1b;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;font-size:14px;max-width:90vw}
#printArea{display:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:flex-end}
.sheetIn{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:10px}
@media (min-width:760px){.card,.banner,.blk{max-width:760px;margin-left:auto;margin-right:auto}.grp{max-width:760px;margin-left:auto;margin-right:auto}}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff}
  #app,nav.tabs,header.top,.toast{display:none!important}
  #printArea{display:block!important;font-size:9px}
  #printArea h1{font-size:13px;margin:0 0 4px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #999;padding:1px 2px;text-align:center}
  #printArea td.n{text-align:left;width:160px}
  #printArea td.a{color:#d02a1e;font-weight:700}
  #printArea td.g{font-weight:800}
  #printArea .bc{height:20px;width:120px;display:block;margin-top:1px}
  #printArea td.inv{width:46px;height:30px;vertical-align:top;text-align:right;color:#888;font-size:8px}
  #printArea tr{page-break-inside:avoid}
  #printArea .grpr td{background:#eee;font-weight:800;text-align:left}
}
</style>

<body>
<header class="top hide"><h1>Coop Besteladvies</h1><span class="sync" id="sync"></span><button class="iconbtn" id="menuB" aria-label="Menu">☰</button></header>
<main id="app"></main>
<nav class="tabs hide"><button data-t="vers">Vers</button><button data-t="kw">KW</button><button data-t="overig">Overig</button><button data-t="beheer" id="tabB" class="hide">Beheer</button></nav>
<div id="printArea"></div>

<script>/* Coop Besteladvies – rekenkern en inleesfuncties (gedeeld door app en tests) */
(function (root) {
'use strict';
const C = {};

/* ---------- datums ---------- */
const pad = (n, l = 2) => String(n).padStart(l, '0');
C.ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
C.date = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
C.add = (s, n) => { const d = C.date(s); d.setDate(d.getDate() + n); return C.ymd(d); };
C.diff = (a, b) => Math.round((C.date(b) - C.date(a)) / 864e5);
C.wd = s => (C.date(s).getDay() + 6) % 7; // 0=ma..6=zo
C.today = () => C.ymd(new Date());
C.isoWeek = s => {
  const d = C.date(s); const t = new Date(d); t.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const y = t.getFullYear(); const j4 = new Date(y, 0, 4, 12);
  return { y, w: 1 + Math.round(((t - j4) / 864e5 - 3 + ((j4.getDay() + 6) % 7)) / 7) };
};
C.mondayOf = (y, w) => { const j4 = new Date(y, 0, 4, 12); const m = new Date(j4); m.setDate(j4.getDate() - ((j4.getDay() + 6) % 7) + (w - 1) * 7); return C.ymd(m); };
C.monday = s => C.add(s, -C.wd(s));
C.DAGEN = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'];
C.DAGNAAM = ['maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag', 'zondag'];
C.fmtDag = s => { const d = C.date(s); return `${C.DAGEN[C.wd(s)]} ${d.getDate()}-${d.getMonth() + 1}`; };

/* ---------- getallen ---------- */
C.num = v => {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v).trim().replace(/[€\s]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s); return isFinite(n) ? n : 0;
};
C.r = (n, d = 1) => { const f = 10 ** d; return Math.round(n * f) / f; };
C.fmt = (n, d = 1) => { if (n === null || n === undefined || !isFinite(n)) return ''; const v = C.r(n, d); return (Number.isInteger(v) ? String(v) : v.toFixed(d)).replace('.', ','); };
C.eur = n => n ? '€ ' + n.toFixed(2).replace('.', ',') : '';
C.nr6 = s => { s = String(s ?? '').trim(); if (/^\d+$/.test(s) && s.length < 6) s = s.padStart(6, '0'); return s; };

/* ---------- PDF: tekstregels ---------- */
C.pdfPages = async (pdfjs, buf) => {
  const doc = await pdfjs.getDocument({ data: new Uint8Array(buf), disableFontFace: true, isEvalSupported: false }).promise;
  const pages = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    pages.push(tc.items.filter(i => i.str && i.str.trim()).map(i => ({ s: i.str, x: i.transform[4], y: i.transform[5] })));
  }
  return pages;
};
C.lines = items => {
  const its = items.slice().sort((a, b) => b.y - a.y || a.x - b.x);
  const out = []; let cur = null;
  for (const t of its) {
    if (!cur || Math.abs(t.y - cur.y) > 2) { cur = { y: t.y, it: [] }; out.push(cur); }
    cur.it.push(t);
  }
  out.forEach(l => { l.it.sort((a, b) => a.x - b.x); l.txt = l.it.map(i => i.s).join(' ').replace(/\s+/g, ' ').trim(); });
  return out;
};
C.detectPdf = pages => {
  const t = pages.slice(0, 9).flat().map(i => i.s).join(' ');
  if (/looptijd/i.test(t) && /CAP/.test(t)) return 'actie';
  if (/ART\.NR/.test(t) && /VERP\./.test(t)) return 'kw';
  if (/Bst\.nr\./.test(t) && /Cons\.prijs/.test(t)) return 'vers';
  return null;
};

/* ---------- Bestelboek Versunie (vers) ---------- */
C.parseVers = pages => {
  const arts = []; let groep = '', week = null, i = 0, prev = null;
  for (const pg of pages) {
    for (const ln of C.lines(pg)) {
      const f = ln.it[0];
      if (/Bst\.nr\.|Artikelomschrijving|Cons\.prijs|^Pagina/.test(ln.txt)) {
        if (week === null) { const m = ln.it.filter(t => /^\d{2}$/.test(t.s.trim()) && t.x > 380); if (m.length) week = +m[0].s; }
        continue;
      }
      if (f.x > 20 && f.x < 45 && ln.it.length === 1 && !/^\d/.test(ln.txt)) { groep = ln.txt.trim(); prev = null; continue; }
      if (f.x < 20 && /^\d{6}$/.test(f.s.trim())) {
        const naam = ln.it.filter(t => t.x > 40 && t.x < 330).map(t => t.s).join(' ').trim();
        const bst = (ln.it.find(t => t.x > 330 && t.x < 380) || {}).s || '';
        prev = { nr: f.s.trim(), naam, bst: bst.trim(), eh: '', cons: 0, ink: 0, groep, i: i++ };
        arts.push(prev); continue;
      }
      if (prev && f.x < 20 && /^[A-Z]{2}$/.test(f.s.trim())) {
        prev.eh = f.s.trim();
        const nums = ln.it.filter(t => t.x > 140).map(t => C.num(t.s));
        if (nums.length >= 1) prev.cons = nums[0]; if (nums.length >= 2) prev.ink = nums[1];
        prev = null;
      }
    }
  }
  arts.forEach(a => Object.assign(a, C.eenheidVers(a)));
  return { bron: 'vers', week, artikelen: arts.filter(a => a.groep !== 'Aanvraag documenten') };
};
C.eenheidVers = a => {
  const n = a.naam.toLowerCase().replace(',', '.');
  let he = 1, kg = 0, perHE = a.eh !== 'ST', check = false;
  const mx = n.match(/(\d+)\s*x\s*([\d.]+)\s*(kg|gr|g|st|lt|l|ml|cl)?/);
  const los = n.match(/\blos\b.*?([\d.]+)\s*kg/) || (a.eh !== 'ST' && n.match(/([\d.]+)\s*kg\b(?!.*\d+\s*x)/));
  if (mx && +mx[1] > 1) { he = +mx[1]; }
  else if (los) { kg = parseFloat(los[1]); he = kg; }
  else if (a.eh !== 'ST') { const st = n.match(/(\d+)\s*st\b/); if (st) he = +st[1]; else check = true; }
  if (a.eh === 'ST') { if (mx && +mx[1] >= 4) { perHE = true; check = true; } else { he = 1; kg = 0; perHE = false; } }
  return { he, kg, perHE, check };
};

/* ---------- Bestelboek Van Tol (kw) ---------- */
C.parseKw = pages => {
  const arts = []; let datum = null, i = 0, prev = null, stack = ['', '', ''], run = [];
  const flushRun = () => { if (!run.length) return; const n = Math.min(run.length, 3); stack = stack.slice(0, 3 - n).concat(run.slice(-n)); run = []; };
  for (const pg of pages) {
    for (const ln of C.lines(pg)) {
      const f = ln.it[0];
      if (!datum) { const m = ln.txt.match(/(\d{2})\.(\d{2})\.(\d{4})\s+\d+\/\d+/); if (m) datum = `${m[3]}-${m[2]}-${m[1]}`; }
      if (/^VERP\.|^ART\.NR/.test(ln.txt) || /^\d{2}\.\d{2}\.\d{4}\s+\d+\/\d+$/.test(ln.txt) || /^\d{2}\/\d{2}$/.test(ln.txt)) continue;
      if (f.x > 88 && f.x < 100 && ln.it.length === 1) { run.push(ln.txt.trim()); prev = null; continue; }
      const m1 = ln.txt.match(/^(\d+)\s+([A-Z]{1,3})\s+(.+?)(?:\s+(K[A-Z]))?$/);
      if (f.x > 51 && f.x < 62 && m1 && ln.it.some(t => t.x > 80 && t.x < 100)) {
        flushRun();
        const naam = ln.it.filter(t => t.x > 80 && t.x < 340).map(t => t.s).join(' ').trim();
        const kl = (ln.it.find(t => t.x > 340) || {}).s || '';
        prev = { he: +m1[1], eh: m1[2], naam, kl: kl.trim() }; continue;
      }
      if (prev && f.x < 50 && /^\d{6}$/.test(f.s.trim())) {
        const merk = (ln.it.find(t => t.x > 80 && t.x < 140) || {}).s || '';
        const rest = ln.it.filter(t => t.x > 160 && t.x < 250).map(t => t.s).join(' ');
        const nums = (rest.match(/\d+\.\d+/g) || []).map(Number);
        const a = { nr: f.s.trim(), naam: prev.naam, merk: merk.trim(), eh: prev.eh, he: prev.he, kg: 0, perHE: prev.he > 1, check: false,
          cons: nums[0] || 0, ink: nums[1] || 0, kl: prev.kl, afd: stack[0], groep: [stack[1], stack[2]].filter(Boolean).join(' › '), i: i++ };
        arts.push(a); prev = null;
      }
    }
  }
  return { bron: 'kw', datum, artikelen: arts };
};

/* ---------- Actie-pdf ---------- */
C.parseActie = pages => {
  let van = null, tm = null, week = null; const items = [];
  for (const pg of pages) {
    const ls = C.lines(pg);
    for (const ln of ls) { const m = ln.txt.match(/week\s+(\d+)\s+looptijd\s+(\d{2})-(\d{2})-(\d{4})\s+tot en met\s+(\d{2})-(\d{2})-(\d{4})/i); if (m) { week = +m[1]; van = `${m[4]}-${m[3]}-${m[2]}`; tm = `${m[7]}-${m[6]}-${m[5]}`; } }
    const anchors = ls.filter(l => l.it.some(t => t.x > 78 && t.x < 100 && /^\d{6}$/.test(t.s.trim())));
    const rows = anchors.map(a => ({ y: a.y, ln: a, parts: [] }));
    for (const ln of ls) {
      if (anchors.includes(ln) || !rows.length) continue;
      if (/looptijd|Art nr|Aanwezig|Instore actie|Pagina/.test(ln.txt)) continue;
      let best = rows[0]; for (const r of rows) if (Math.abs(r.y - ln.y) < Math.abs(best.y - ln.y)) best = r;
      if (Math.abs(best.y - ln.y) > 14) continue;
      for (const t of ln.it) best.parts.push({ y: ln.y, x: t.x, s: t.s });
    }
    for (const r of rows) {
      const it = r.ln.it;
      const nr = it.find(t => t.x > 78 && t.x < 100).s.trim();
      const folder = it.some(t => t.x < 40 && /X/i.test(t.s));
      const all = r.parts.concat(it.map(t => ({ y: r.y, x: t.x, s: t.s }))).sort((a, b) => b.y - a.y || a.x - b.x);
      const naam = all.filter(t => t.x > 120 && t.x < 300).map(t => t.s.trim()).join(' ').replace(/\s+/g, ' ').trim();
      const opm = all.filter(t => t.x > 475).map(t => t.s.trim()).join(' ').replace(/\s+/g, ' ').trim();
      const eh = (it.find(t => t.x > 300 && t.x < 335) || {}).s || '';
      const nums = it.filter(t => t.x > 340 && t.x < 475 && /\d/.test(t.s)).map(t => C.num(t.s));

  <button class="btn" id="iSave">Instellingen opslaan</button></div></div>
  <div class="blk"><h2>Feestdagen en bijzondere dagen</h2><p class="small">Komend jaar. Het effect op de verkoop wordt elk jaar onthouden en de volgende keer gebruikt.</p><div class="list">
  ${bz.map(d => { const b = M.bijz[d]; return `<div class="it" style="flex-wrap:wrap"><span style="flex:1 1 180px"><b>${esc(b.naam)}</b><br><span class="small">${C.fmtDag(d)} ${d.slice(0, 4)}${effTxt(b.naam)}${voorEff(b.naam)}</span></span>
  <select data-ag="${d}" data-f="soort"><option value="normaal" ${b.soort === 'normaal' ? 'selected' : ''}>Normaal open</option><option value="aangepast" ${b.soort === 'aangepast' ? 'selected' : ''}>Aangepaste tijden</option><option value="gesloten" ${b.soort === 'gesloten' ? 'selected' : ''}>Gesloten</option></select>
  ${b.soort === 'aangepast' ? `<input type="time" data-ag="${d}" data-f="open" value="${b.open || ''}" style="width:105px"><input type="time" data-ag="${d}" data-f="dicht" value="${b.dicht || ''}" style="width:105px">` : ''}</div>`; }).join('')}</div>
  <h3>Eigen bijzondere dag toevoegen</h3><div class="row"><input type="date" id="agD"><input type="text" id="agN" placeholder="Naam (bijv. Braderie)" style="flex:1"><button class="btn sm" id="agAdd">Toevoegen</button></div></div>
  <div class="blk"><h2>Niet gekoppeld (${M.onbekend.length})</h2><p class="small">Verkocht via Versunie of Van Tol, maar het bestelnummer staat niet in het bestelboek. Meestal nieuw of uit het assortiment.</p><div class="list">${M.onbekend.slice(0, 200).map(o => `<div class="it"><span>${esc(o.n)} <span class="small">· ${esc(o.l)} · bestelnr ${esc(o.b)} · ${o.ean}</span></span></div>`).join('') || '<div class="small">Alles gekoppeld.</div>'}</div></div>
  <div class="blk"><h2>Besteleenheid controleren (${chk.length})</h2><p class="small">Bij deze artikelen is de besteleenheid uit de naam afgeleid. Pas aan als het niet klopt.</p><div class="list">${chk.map(a => `<div class="it" style="flex-wrap:wrap"><span style="flex:1 1 200px">${esc(a.naam)} <span class="small">${a.nr} · ${a.eh}</span></span><label class="small">per HE <input type="checkbox" data-he="${a.key}" data-f="perHE" ${a.perHE ? 'checked' : ''}></label><input type="number" step="0.1" data-he="${a.key}" data-f="he" value="${a.he}" style="width:80px"><button class="btn sm sec" data-heok="${a.key}">Klopt</button></div>`).join('') || '<div class="small">Niets te controleren.</div>'}</div></div>
  <div class="blk"><h2>Account</h2><p>Ingelogd als <b>${esc(sess && sess.email)}</b> (beheerder) · versie ${VERSIE}</p>${DEMO ? '' : '<button class="btn sec" id="logout">Uitloggen</button>'}</div>`;
  // events
  $('#up').onchange = e => uploads([...e.target.files]);
  v.querySelectorAll('[data-delac]').forEach(b => b.onclick = async () => { if (!ask('Deze actieweek verwijderen?')) return; await adminDo(async () => { if (!DEMO) await remove('acties', 'id=eq.' + b.dataset.delac); S.acties = S.acties.filter(a => a.id !== b.dataset.delac); }); });
  v.querySelectorAll('[data-deldag]').forEach(b => b.onclick = async () => { if (!ask('Dag-export van ' + b.dataset.deldag + ' verwijderen?')) return; await adminDo(async () => { const d = b.dataset.deldag; if (!DEMO) await remove('dagverkoop', 'dag=eq.' + d); delete S.dagen[d]; delete S.dagMeta[d]; await idel('d:' + d); }); });
  const inst = () => JSON.parse(JSON.stringify(Object.assign({}, S.inst || {}, { weken: st.weken, buffer: st.buffer, actieFactor: st.actieFactor, vooraf: st.vooraf, schema: st.schema, open: st.open, he: st.he })));
  const work = inst();
  v.querySelectorAll('[data-sch]').forEach(s => s.onchange = () => { work.schema[s.dataset.sch][+s.dataset.i][s.dataset.f] = +s.value; });
  v.querySelectorAll('[data-schdel]').forEach(b => b.onclick = () => { work.schema[b.dataset.schdel].splice(+b.dataset.i, 1); saveInst(work); });
  v.querySelectorAll('[data-schadd]').forEach(b => b.onclick = () => { work.schema[b.dataset.schadd].push({ b: 0, l: 2 }); saveInst(work); });
  v.querySelectorAll('[data-op]').forEach(i => i.onchange = () => { work.open[+i.dataset.op][+i.dataset.f] = i.value; });
  $('#iSave').onclick = () => { work.weken = Math.max(3, Math.min(26, +$('#iW').value || 8)); work.buffer = { vers: +$('#iBV').value || 0, kw: +$('#iBK').value || 0 }; work.actieFactor = { folder: C.num($('#iAF').value) || 3, instore: C.num($('#iAI').value) || 1.5 }; work.vooraf = $('#iVo').checked; saveInst(work); };
  v.querySelectorAll('[data-ag]').forEach(i => i.onchange = () => { const d = i.dataset.ag; const b = M.bijz[d]; const row = Object.assign({ dag: d, naam: b.naam, soort: b.soort || 'normaal', open: b.open || null, dicht: b.dicht || null }, S.agenda.find(x => x.dag === d) || {}); row[i.dataset.f] = i.value || null; if (row.soort === 'aangepast' && !row.open) { row.open = M.st.open[C.wd(d)][0] || '08:00'; row.dicht = '16:00'; } saveAgenda(row); });
  $('#agAdd').onclick = () => { const d = $('#agD').value, n = $('#agN').value.trim(); if (!d || !n) return toast('Vul datum en naam in'); saveAgenda({ dag: d, naam: n, soort: 'normaal', open: null, dicht: null }); };
  v.querySelectorAll('[data-heok]').forEach(b => b.onclick = () => { const key = b.dataset.heok; const row = b.closest('.it'); const he = C.num(row.querySelector('[data-f="he"]').value) || 1; const perHE = row.querySelector('[data-f="perHE"]').checked; work.he[key] = { he, perHE, check: false }; saveInst(work); });
  const lo = $('#logout'); if (lo) lo.onclick = logout;
}
async function adminDo(fn) {
  try { if (!DEMO && !navigator.onLine) throw new Error('Je bent offline'); await fn(); await saveCache(); rebuild(); render(); toast('Opgeslagen'); }
  catch (e) { toast('Mislukt: ' + e.message, 5000); }
}
function saveInst(data) { return adminDo(async () => { if (!DEMO) await upsert('instellingen', [{ id: 1, data }], 'id'); S.inst = data; }); }
function saveAgenda(row) { return adminDo(async () => { if (!DEMO) await upsert('agenda', [row], 'dag'); S.agenda = S.agenda.filter(a => a.dag !== row.dag).concat([row]); }); }

/* ---------- uploads ---------- */
const libs = {};
function loadScript(src) { return libs[src] || (libs[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Kon onderdeel niet laden (offline?)')); document.head.appendChild(s); })); }
async function pdfjs() { await loadScript(LIB.pdf); const p = window.pdfjsLib; if (!p.GlobalWorkerOptions.workerSrc) p.GlobalWorkerOptions.workerSrc = LIB.pdfw; return p; }
async function uploads(files) {
  const log = $('#upLog'); log.classList.remove('hide'); log.innerHTML = '';
  const L = (t, c = '') => { log.insertAdjacentHTML('beforeend', `<div class="${c}">${esc(t)}</div>`); log.scrollTop = 1e9; };
  if (!DEMO && !navigator.onLine) return L('Je bent offline. Uploaden kan alleen met internet.', 'err');
  files.sort((a, b) => (/\.pdf$/i.test(a.name) ? 0 : 1) - (/\.pdf$/i.test(b.name) ? 0 : 1) || a.name.localeCompare(b.name));
  let n = 0;
  for (const f of files) {
    try {
      const buf = await f.arrayBuffer();
      if (/\.xlsx?$/i.test(f.name)) {
        await loadScript(LIB.xlsx);
        const wb = XLSX.read(buf, { type: 'array' }); const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: null });
        const r = C.parseCaspos(rows, f.name);
        if (!DEMO) {
          await upsert('dagverkoop', [{ dag: r.dag, data: r.data, bestand: f.name, geupload: new Date().toISOString() }], 'dag');
          const krows = Object.entries(r.meta).map(([ean, m]) => Object.assign({ ean, gezien: r.dag }, m));
          for (let i = 0; i < krows.length; i += 500) await upsert('kassa', krows.slice(i, i + 500), 'ean');
        }
        S.dagen[r.dag] = r.data; S.dagMeta[r.dag] = new Date().toISOString(); await iset('d:' + r.dag, r.data);
        for (const [ean, m] of Object.entries(r.meta)) S.kassa[ean] = Object.assign({ ean, gezien: r.dag }, m);
        L(`✓ Verkoop ${C.fmtDag(r.dag)} ${r.dag.slice(0, 4)}: ${r.n} artikelen`, 'ok'); n++;
      } else if (/\.pdf$/i.test(f.name)) {
        L(`… ${f.name} lezen`);
        const pages = await C.pdfPages(await pdfjs(), buf); const soort = C.detectPdf(pages);
        if (soort === 'vers' || soort === 'kw') {
          const b = soort === 'vers' ? C.parseVers(pages) : C.parseKw(pages);
          if (b.artikelen.length < 50) throw new Error('Te weinig artikelen gevonden – is dit het juiste bestelboek?');
          if (soort === 'vers') { const iw = C.isoWeek(C.today()); let y = iw.y; if (b.week > iw.w + 26) y--; if (b.week < iw.w - 26) y++; b.datum = C.mondayOf(y, b.week); }
          const oud = S.boeken[soort];
          if (oud && oud.datum && b.datum && b.datum < oud.datum && !ask(`Dit bestelboek (${b.datum}) is ouder dan het huidige (${oud.datum}). Toch gebruiken?`)) { L('Overgeslagen: ouder bestelboek', 'err'); continue; }
          const cmp = oud && (!oud.datum || !b.datum || b.datum !== oud.datum) ? C.vergelijk(oud, b, S.schapOk) : { nieuw: oud ? (oud.nieuw || []) : [], uit: oud ? (oud.uit || []) : [] };
          const row = { bron: soort, datum: b.datum, week: b.week || C.isoWeek(b.datum).w, artikelen: b.artikelen, nieuw: cmp.nieuw, uit: cmp.uit, bestand: f.name, geupload: new Date().toISOString() };
          if (!DEMO) await upsert('boeken', [row], 'bron');
          S.boeken[soort] = row;
          L(`✓ Bestelboek ${soort === 'vers' ? 'Vers' : 'KW'}: ${b.artikelen.length} artikelen · ${cmp.nieuw.length} nieuw · ${cmp.uit.length} uit assortiment`, 'ok'); n++;
        } else if (soort === 'actie') {
          const a = C.parseActie(pages); if (!a.week || !a.items.length) throw new Error('Geen acties gevonden');
          let y = +a.van.slice(0, 4); if (a.week < 10 && a.van.slice(5, 7) === '12') y++;
          const row = { id: `${y}-${String(a.week).padStart(2, '0')}`, week: a.week, van: a.van, tm: a.tm, items: a.items, bestand: f.name, geupload: new Date().toISOString() };
          if (!DEMO) await upsert('acties', [row], 'id');
          S.acties = S.acties.filter(x => x.id !== row.id).concat([row]).sort((p, q) => p.van < q.van ? -1 : 1);
          L(`✓ Acties week ${a.week}: ${a.items.length} artikelen (${a.items.filter(i => i.folder).length} folder, ${a.items.filter(i => !i.folder).length} instore)`, 'ok'); n++;
        } else throw new Error('Onbekende pdf – geen bestelboek of actie-pdf');
      } else throw new Error('Bestandstype niet ondersteund');
    } catch (e) { L(`✗ ${f.name}: ${e.message}`, 'err'); }
  }
  if (n) { await saveCache(); rebuild(); L(`Klaar: ${n} bestand(en) verwerkt.`, 'ok'); const keep = log.innerHTML; renderBeheer(); const l2 = $('#upLog'); l2.classList.remove('hide'); l2.innerHTML = keep; }
}

/* ---------- printen ---------- */
function printLijst(bron, arts) {
  const lijst = C.besteldagen(M, bron, 3);
  const mon = C.monday(C.today()); const wkn = [3, 2, 1].map(w => C.isoWeek(C.add(mon, -7 * w)).w);
  let h = `<h1>Bestellijst ${bron === 'vers' ? 'Vers' : 'KW'} – ${C.fmtDag(C.today())} ${C.today().slice(0, 4)} · week ${wkn.join(', ')} + gemiddelde (Gd) · rood = actie</h1><table><thead><tr><th rowspan="2">Artikel</th><th rowspan="2">Eh</th><th rowspan="2">Gwt</th>${C.DAGEN.map(d => `<th colspan="4">${d}</th>`).join('')}${lijst.map(l => `<th rowspan="2">Bestel<br>${C.fmtDag(l.besteldag)}</th>`).join('')}</tr><tr>${C.DAGEN.map(() => wkn.map(w => `<th>${w}</th>`).join('') + '<th>Gd</th>').join('')}</tr></thead><tbody>`;
  let lastG = null;
  for (const a of arts) {
    if (a.uit) continue;
    const g = groepVan(a); if (g !== lastG) { h += `<tr class="grpr"><td colspan="${3 + 28 + lijst.length}">${esc(g)}</td></tr>`; lastG = g; }
    const wt = C.weekTabel(M, a.key); const lbl = C.actieLabel(M, a.key);
    h += `<tr><td class="n"><b>${a.nr}</b> ${esc(a.naam)}${lbl ? ` <i>(actie ${lbl[0].t} wk, ${lbl[0].folder ? 'folder' : 'instore'})</i>` : ''}${C.barcode(a.nr, 30)}</td><td>${a.eh}${a.perHE ? ' ' + C.fmt(a.he) : ''}</td><td class="g">${C.fmt(wt.gwt)}</td>`;
    for (let d = 0; d < 7; d++) { for (let w = 0; w < 3; w++) { const c = wt.rows[w].cells[d]; h += `<td class="${c.actie ? 'a' : ''}">${c.v === null || c.v === 0 ? '' : C.fmt(c.v)}</td>`; } h += `<td class="g">${C.fmt(wt.gd[d]) === '0' ? '' : C.fmt(wt.gd[d])}</td>`; }
    for (const l of lijst) { const ad = C.advies(M, a.key, l, null, []); h += `<td class="inv">${ad.adv ? 'adv ' + ad.adv : ''}</td>`; }
    h += '</tr>';
  }
  h += '</tbody></table>';
  $('#printArea').innerHTML = h;
  setTimeout(() => window.print(), 100);
}

/* ---------- start ---------- */
document.addEventListener('DOMContentLoaded', () => {
  if ('serviceWorker' in navigator && !DEMO && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  if (DEMO) return showLogin();
  if (sess) start(); else showLogin();
});
window.__cba = { S, get M() { return M; }, ui, render };
})();
</script>
